[gcode_macro LOAD_FILAMENT]
gcode:
    {% if printer.save_variables.variables.load_unload_state|int != 0 %}
      M118 Printer is loading busy.
    {% else %}
       M118 load filament
      {% set target = params.S|default(0)|int %}
      {% set nozzle = params.T|default(0)|int %}
      {% set safe_min_temp = printer.extruder.min_extrude_temp|default(170) %}
      {% if target > safe_min_temp %}
        PREPARE_LOAD
        M104 T{nozzle} S{target}
        M118 [LOAD FILAMENT] start waiting temperature...
        SAVE_VARIABLE VARIABLE=load_unload_temperature VALUE={target}
        SAVE_VARIABLE VARIABLE=load_unload_nozzle VALUE={nozzle}
        UPDATE_DELAYED_GCODE ID=WAITING_TEMPERATURE DURATION=2
      {% else %}
        M118 target temperature too low, stop laoding.
      {% endif %}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% if printer.save_variables.variables.load_unload_state|int != 0 %}
      M118 Printer is unloading busy.
    {% else %}
      M118 unload filament
      {% set target = params.S|default(0)|int %}
      {% set nozzle = params.T|default(0)|int %}
      {% set safe_min_temp = printer.extruder.min_extrude_temp|default(170) %}
      {% if target > safe_min_temp %}
        PREPARE_UNLOAD
        M104 T{nozzle} S{target}
        M118 [UNLOAD FILAMENT] start waiting temperature...
        SAVE_VARIABLE VARIABLE=load_unload_temperature VALUE={target}
        SAVE_VARIABLE VARIABLE=load_unload_nozzle VALUE={nozzle}
        UPDATE_DELAYED_GCODE ID=WAITING_TEMPERATURE DURATION=2
      {% else %}
        M118 target temperature too low, stop unloading.
      {% endif %}
    {% endif %}

[delayed_gcode WAITING_TEMPERATURE]
gcode:
    M118 wait target temperature
    {% set target = printer.save_variables.variables.load_unload_temperature|int %}
    {% set nozzle = printer.save_variables.variables.load_unload_nozzle|int %}
    {% set temperature = printer.extruder.temperature|int %}
    {% if nozzle == 1 %}
      {% set temperature = printer.extruder1.temperature|int %}
    {% endif %}
    {% if printer.save_variables.variables.load_unload_state|int != 0 %}
        M118 wait temperature...
        {% if temperature < target %}
          UPDATE_DELAYED_GCODE ID=WAITING_TEMPERATURE DURATION=2
        {% else %}
          UPDATE_DELAYED_GCODE ID=LOADING_UNLOADING DURATION=1
          {% if printer.save_variables.variables.load_unload_state|int == 1 %}
              M118 [UNLOAD FILAMENT] wait temperature finished, start loading...
          {% endif %}
          {% if printer.save_variables.variables.load_unload_state|int == -1 %}
              M118 [UNLOAD FILAMENT] wait temperature finished, start unloading...
          {% endif %}
        {% endif %}
    {% endif %}
    

[delayed_gcode LOADING_UNLOADING]
gcode:
    {% if printer.save_variables.variables.load_unload_state|int == 1 %}
        M118 delay gcode loading
        M83
        G1 E2 F300
        UPDATE_DELAYED_GCODE ID=LOADING_UNLOADING DURATION=.4
    {% endif %}
    {% if printer.save_variables.variables.load_unload_state|int == -1 %}
        M118 delay gcode unloading
        M83
        G1 E-2 F300
        UPDATE_DELAYED_GCODE ID=LOADING_UNLOADING DURATION=.4
    {% endif %}

[gcode_macro PREPARE_LOAD]
gcode:
    SAVE_VARIABLE VARIABLE=load_unload_state VALUE=1

[gcode_macro PREPARE_UNLOAD]
gcode:
    SAVE_VARIABLE VARIABLE=load_unload_state VALUE=-1

[gcode_macro STOP_LOADUNLOAD]
gcode:
	SAVE_VARIABLE VARIABLE=load_unload_state VALUE=0
    {% set nozzle = printer.save_variables.variables.load_unload_nozzle|int %}
    {% if nozzle == 0 %}
      G4 P5000
      M2800
    {% endif %}
    M104 T0 S0
    M104 T1 S0
    M118 [UNLOAD FILAMENT] stop load/unload
