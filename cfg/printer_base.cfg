[aniso_bed_mesh]   # 压电陶瓷
pin1:PF10
pin2:PF9
pin3:PF6
pin4:PF5
adc_trigger:180

[probe]   # z轴限位开关
pin:PB5
samples: 4
samples_result: average
z_offset:-0.65
sample_retract_dist:5
speed: 5
samples_tolerance: 0.2
samples_tolerance_retries: 5

[bed_mesh]   # 网床调平
speed: 100
horizontal_move_z: 5
mesh_min: 50, 20
mesh_max: 300, 300
probe_count: 8,8
algorithm: bicubic

[xyz_align]   # xyz_offset校准
pin: PG11
t0_offset_x:90
t0_offset_y:331
# t0_offset_z:8
# t0_offset_z_press:-1
t1_offset_x:49
t1_offset_y:331
# t1_offset_z:8
# t1_offset_z_press:3
move_offset:10
speed:600
  
[gcode_macro G28]
rename_existing: G28.1
gcode:
  M118 Input Params: {rawparams}
  {% if not rawparams or 'Z' in rawparams|upper or 'T' in rawparams|upper %}
    {% set sensitivity = params.T|default(50)|float %}
    M118 Running PROBE_ALIGN
    PROBE_ALIGN T={sensitivity}
  {% else %}
    {% if 'Y' in rawparams|upper %}
      G28.1 Y
      G1 Y5
      G4 P2000
    {% endif %}
    {% if 'X' in rawparams|upper %}
      G28.1 X
      G1 X-35
    {% endif %}
  {% endif %}
  
##################################################### 切换喷头相关
[gcode_macro T0]
gcode:
  {% if printer.toolhead.homed_axes == 'xyz' %}  
  G91
  G1 Z4 F300
  G90
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  SET_GCODE_OFFSET X=0 Y=0 Z=0

  G1 X0 F6000
  G91
  G1 Z-4 F300
  G90
  {% endif %}  

[gcode_macro T1]
gcode:
  {% if printer.toolhead.homed_axes == 'xyz' %}  
  G91
  G1 Z4 F300
  G90
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  SET_GCODE_OFFSET X=-39.5 Y=-1.2 Z=1.36   #z越小越紧   X=-41.1 Y=-1.15
  
  G1 X383.7 F6000   #X388.1
  G4 P1000
  G1 X330 F6000
  G91
  G1 Z-4 F300
  G90
  {% endif %}

[gcode_macro AE]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro AE1]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  
[gcode_macro AE2]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder2

[gcode_macro TEST_EX]
gcode:
  {% for wipe in range(100) %}
    SET_SERVO SERVO=my_servo ANGLE=0
    G4 P1000
    SET_SERVO SERVO=my_servo ANGLE=90
    G4 P1000
  {% endfor %}

# CLEAN 
[gcode_macro CLEAN]
gcode:
  {% if printer.toolhead.homed_axes != 'xy' and  printer.toolhead.homed_axes != 'xyz' %}    
    G28 X Y
  {% endif %}
    {% set current_ext = printer.toolhead.extruder %}
    {% if current_ext == "extruder" or current_ext == "extruder2"%}
      M118 当前是主喷嘴 extruder
    {% elif current_ext == "extruder1" %}
      M118 当前是第二喷嘴 extruder1
      SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% else %}
      M118 未知的喷嘴
    {% endif %}

    G1 Y250 F3000
    G1 X265
    G1 Y343
    
    {% for count in range(10) %}
      G1 X265
      G1 X245
    {% endfor %}
    
    {% if current_ext == "extruder1" %}
      SET_GCODE_OFFSET X=-41 Y=-2.089 Z=2.559350
    {% endif %}
    
# 舵机启用宏定义
# M280 S1切断、M280 S0 恢复初始
# 每台机器不同角度进行配置
[gcode_macro M280]
gcode:
  {% set angel = params.S|default(0)|float %}
  {% if angel == 1 %}
    SET_SERVO SERVO=my_servo ANGLE=120
  {% else %}
    SET_SERVO SERVO=my_servo ANGLE=40
  {% endif %}

[gcode_macro M2800]
gcode:
  M280 S1
  G4 P600
  M280 S0

[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% if 'S' not in params %}
    { action_respond_error("S parameter is required") }
  {% else %}
    {% set speed = params.S|float / 255.0 %}
    
    {% if 'L' not in params %}
      SET_FAN_SPEED FAN=fan3 SPEED={speed}
      SET_FAN_SPEED FAN=fan4 SPEED={speed}
    {% else %}
      {% set fan_index = params.L|int %}
      {% if fan_index == 0 %}
        SET_FAN_SPEED FAN=fan3 SPEED={speed}
      {% elif fan_index == 1 %}
        SET_FAN_SPEED FAN=fan4 SPEED={speed}
      {% else %}
        { action_respond_error("L parameter must be 0 or 1") }
      {% endif %}
    {% endif %}
  {% endif %}