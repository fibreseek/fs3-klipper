
# #######################################
# 不同的主板，串口id不同
# #######################################
[mcu]  
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_aniso-if00

[mcu anisoprint]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 50  #300
max_z_accel: 500

[force_move]   # 强制移动xyz电机
enable_force_move: True 

# [ws2812b]  #串口灯带控制
# serial:/dev/ttyS9
# baud:115200

# [output_pin PWM_PIN]   #仓内照明
# pin: PE2
# pwm: True
# value: 0
# cycle_time: 0.01

# [force_sensor]   #串口张力传感器控制
# serial:/dev/ttyS7
# baud:9600

[vibration_testing]   #振动测试
# #######################################
# motor and extruder
# #######################################
[stepper_x]   # Motor1
step_pin: PE6
dir_pin: !PB3
enable_pin: !PC14
microsteps: 8
rotation_distance: 39.6
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_endstop: 0
position_max: 400
position_min: 0
homing_speed: 26
homing_retract_dist: 15
homing_retract_speed: 20
second_homing_speed: 26

[stepper_y]   # Motor2 
step_pin: PE4
dir_pin: !PF4
enable_pin: !PF11
microsteps: 8
rotation_distance: 40
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_endstop: 0
position_max: 400
position_min: 0
homing_speed: 22
homing_retract_dist: 15
homing_retract_speed: 20
second_homing_speed: 22

[stepper_z]   # Motor3
step_pin: PB8
dir_pin: !PF15
enable_pin: !PG1
microsteps: 8
rotation_distance: 2.94
#endstop_pin: tmc2240_stepper_z:virtual_endstop
endstop_pin: probe:z_virtual_endstop
#position_endstop: 284.2 #276
position_max: 284.2 #276
position_min: -10
homing_speed: 10
#second_homing_speed: 5
homing_retract_dist: 5

[extruder]   # motor4 纤维挤出
step_pin: PB4
dir_pin: !PE11
enable_pin: !PD9
microsteps: 16
rotation_distance: 32
max_extrude_only_distance: 1000
max_extrude_cross_section: 5.0
rotation_distance: 6.9
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PE2 #PC13  # HE1 PE2
sensor_type: PT1000
sensor_pin: PC5 # TH2
control: pid #watermark
pid_Kp: 13.750
pid_Ki: 22.917
pid_Kd: 2.062
min_temp: -200
max_temp: 500000000
# min_extrude_temp: 10

[extruder1]   # motor5 塑料挤出
step_pin: PG13
dir_pin: !PD13
enable_pin: !PD14
microsteps: 16
rotation_distance: 32
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 1000
max_extrude_cross_section: 5.0
heater_pin: PC13 #PC13 #PE2 # HE0
sensor_type: Generic 3950
sensor_pin: PC4 # TH3 100k
#control: watermark
control: pid
pid_Kp: 10.791
pid_Ki: 0.615
pid_Kd: 47.344
min_temp: -200
max_temp: 500
# min_extrude_temp: 10

[extruder2]   # Motor6 共挤挤出
step_pin: PA15
dir_pin: !PG2
enable_pin: !PA9
microsteps: 16
rotation_distance: 5.719
max_extrude_only_distance: 1000
max_extrude_cross_section: 5.0
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PB11
sensor_type: Generic 3950
sensor_pin: PB0 # THB
control: pid
pid_Kp: 41
pid_Ki: 1.9
pid_Kd: 226
min_temp: -200
max_temp: 300
min_extrude_temp: 10

# #######################################
# TMC2240 configuration
# #######################################
[tmc2240 stepper_x]
cs_pin: PG15
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
diag0_pin: ^!PC15
run_current: 1.5
hold_current: 0.2
stealthchop_threshold: 0
driver_SGT: 2

[tmc2240 stepper_y]
cs_pin: PA4
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
diag0_pin: ^!PC0
run_current: 1.5
hold_current: 0.2
stealthchop_threshold: 0
driver_SGT: 2

[tmc2240 stepper_z]
cs_pin: PF7
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
diag0_pin: ^!PG0
run_current: 0.65
stealthchop_threshold: 0
driver_SGT: 3

[tmc2240 extruder]
cs_pin: PE13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.65
hold_current: 0.2
stealthchop_threshold: 99999

[tmc2240 extruder1]
cs_pin: PE9
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.65
hold_current: 0.2
stealthchop_threshold: 99999

[tmc2240 extruder2]
cs_pin: PG5
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 1.6
hold_current: 0.2
stealthchop_threshold: 99999

# #######################################
# sensor
# #######################################
[heater_bed]   # 热床
heater_pin: PC12
sensor_type: Generic 3950
sensor_pin: PB1 #TH0 
max_power: 1.0
min_temp: 0
max_temp: 125
control: pid # watermark
pid_kp = 66.133
pid_ki = 1.293
pid_kd = 845.677

[servo my_servo]   # 舵机
pin: PD12
# 最大角度
maximum_servo_angle: 180
# 最小脉冲宽度，单位：微秒，转换为秒为 0.0005
minimum_pulse_width: 0.0005 
# 最大脉冲宽度，单位：微秒，转换为秒为 0.0025
maximum_pulse_width: 0.0025  
# 初始角度
initial_angle: 0

[fan]   #主板风扇 M106 S255
pin: PB13
tachometer_pin: PA10

[heater_fan fan1]   # 复合头喉管散热风扇
pin: PF3
tachometer_pin: PD11
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp:15
fan_speed:1.0

[heater_fan fan2]   # 塑料头喉管散热风扇
pin: PA0
tachometer_pin: PD10
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp:15
fan_speed:1.0

[fan_generic fan3]   # 塑料冷却风扇 SET_FAN_SPEED FAN=fan3 SPEED=1
pin: PC3

[fan_generic fan4]   # 纤维冷却风扇 
pin: PC2

# [filament_switch_sensor filament_sensor]   # 光纤传感器
# switch_pin: ^PD5

[filament_switch_sensor filament_sensor_1]   # 共挤extruder2断料检测传感器
switch_pin: ^PE0
pause_on_runout: False

[filament_motion_sensor filament_sensor_2]   # 共挤extruder2堵料检测传感器
switch_pin: ^PE1
extruder:extruder
pause_on_runout: False

[filament_switch_sensor filament_sensor_3]   # 塑料extruder1断料检测传感器
switch_pin: ^PF2
pause_on_runout: False

[filament_motion_sensor filament_sensor_4]   # 塑料extruder1堵料检测传感器
switch_pin: ^PF1
extruder:extruder
# pause_on_runout: False

[lis2dw]   # 三轴加速度传感器 下位机spi
cs_pin: PE7
spi_bus: spi1

[resonance_tester]
accel_chip: lis2dw
probe_points: 100, 100, 100

