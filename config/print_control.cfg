
# This file is part of the Anisotouch Klipper configuration
# It contains the macros for the print control functions like PAUSE, RESUME, CANCEL_PRINT and SDCARD_PRINT_FILE
# It also contains the client variables for the print control macros.

[gcode_macro SDCARD_PRINT_FILE]
description: Print a file from the SD card
rename_existing: SDCARD_PRINT_FILE_BASE
gcode:
  M118 [SDCARD_PRINT_FILE] Start preparing for printing...

  {% set print_mode = printer.save_variables.variables.printing_info_print_mode|default(0)|int %}
  {% set loadunload_client = printer['gcode_macro _LOAD_UNLOAD_VARIABLES']|default({}) %}
  {% set clean_x = loadunload_client.clean_nozzle_x|default(0) %}
  {% set clean_y = loadunload_client.clean_nozzle_y|default(0) %}
  {% set clean_move_speed = loadunload_client.clean_move_speed|default(2000) %}
  {% set target_bed_temp = printer.save_variables.variables.printing_info_bed_preheat_temperature|default(0)|float %}
  {% set temperature_offset = loadunload_client.temperature_offset|default(50) %}
  {% set left_printing_temperature = printer.save_variables.variables.printing_info_left_preheat_temperature|default(210)|float %}
  {% set right_printing_temperature = printer.save_variables.variables.printing_info_right_preheat_temperature|default(210)|float %}
  {% set left_material_temperature = [printer.save_variables.variables.material_info_left_filament_load_temperature|default(210)| float, 180] | max %}
  {% set right_material_temperature = [printer.save_variables.variables.material_info_right_filament_load_temperature|default(210)| float, 180] | max %}
  {% set left_cooling_temperature = [left_material_temperature - temperature_offset, 150] | max %}
  {% set right_cooling_temperature = [right_material_temperature - temperature_offset, 150] | max %}
  {% set mode_x_max = printer.save_variables.variables.printing_info_mode_x_max|default(280)|float %}
  {% set mode_y_max = printer.save_variables.variables.printing_info_mode_y_max|default(280)|float %}
  {% set mode_x_min = printer.save_variables.variables.printing_info_mode_x_min|default(20)|float %}
  {% set mode_y_min = printer.save_variables.variables.printing_info_mode_y_min|default(20)|float %}
  {% set clean_retract_speed = loadunload_client.clean_retract_speed|default(1000) %}
  {% set load_speed = loadunload_client.load_speed|default(300) %}
  {% set preloading_filament_e = loadunload_client.preloading_filament_e|default(40.0) %}
  {% set clean_retract_e = loadunload_client.clean_retract_e|default(-6.0) %}

  {% set tool_client = printer['gcode_macro _TOOL_VARIABLE']|default({}) %}
  {% set tool_switch_max = tool_client.max_tool_switch_pos|default(305) %}
  {% set tool_switch_prepos = tool_switch_max - 15 %}
  {% set tool_switch_speed = tool_client.tool_switch_speed|default(6000) %}
  {% set tool_switch_low_speed = tool_client.tool_switch_low_speed|default(4000) %}
  {% set tool_switch_y_position = tool_client.tool_switch_y_position|default(280.0) %}
  {% set tool_switch_x_position = tool_client.tool_switch_x1_position|default(0.0) %}

  # 设置灯的模式
  {% if print_mode == 0 %}
      M2000 L1 S0
  {% elif print_mode == 1 %}
      M2000 L1 S1
  {% elif print_mode == 2 %}
      M2000 L1 S2
  {% endif %}

  BED_MESH_CLEAR
  SDCARD_RESET_FILE
  # 打开过滤风扇 强制下移3mm，避免打印机头卡住，XY 归位
  M106 P0 S255
  FORCE_MOVE STEPPER=stepper_z DISTANCE=3 VELOCITY=10
  G28 X Y
  # 物理切换到T0
  AE
  G1 Y{tool_switch_y_position} F{tool_switch_speed}
  G1 X{tool_switch_x_position} F{tool_switch_speed}
  G1 X{tool_switch_prepos} F{tool_switch_speed}
  G1 X{tool_switch_max} F{tool_switch_low_speed}
  G4 P300
  MOVE_TO_WASTE_STATION
  MOVE_LEFT_PRELOAD_POSITION

  # 预热底板温度
  {% if target_bed_temp > 0 %}
    M118 [SDCARD_PRINT_FILE] Start heating the bed...
    M140 S{target_bed_temp}
  {% endif %}

  # 预热左边喷嘴温度
  {% if left_cooling_temperature > 0 %}
    M118 [SDCARD_PRINT_FILE] Start heating the left nozzle...
    M109 T0 S{left_cooling_temperature}
  {% endif %}

  RELEASE_WASTE_FILAMENT
  MOVE_LEFT_BRUSH_POSITION
  BRUSH_NOZZLE2
  MOVE_TO_WASTE_STATION

  # 快速冷却喷嘴
  # M106 P1 S255
  # M109 T1 S{right_cooling_temperature}
  # M109 T0 S{left_cooling_temperature}
  # M106 P1 S0
  #激活extruder,清理喷嘴
  # AE
  # BRUSH_NOZZLE

  # 等待底板温度
  {% if target_bed_temp > 0 %}
      M190 S{target_bed_temp}
  {% endif %}

  # 移出废料站
  MOVE_OUT_WASTE_STATION
  M400

  #归零
  M118 [SDCARD_PRINT_FILE] Homing xyz...
  G4 P2000
  M400
  G28

  # 调平探测
  {% set s_value = printer.save_variables.variables.printing_info_auto_leveling|default(0)|int %}
  {% if s_value == 1 %} # 选择调平
      M118 [SDCARD_PRINT_FILE] Start leveling detection...
      {% set BED_MESH_CALIBRATE_FAST_ENABLE = 1 %} # TODO: 快速调平标志位
      {% if BED_MESH_CALIBRATE_FAST_ENABLE == 0 %} # 不需要快速调平
          BED_MESH_CLEAR
          BED_MESH_CALIBRATE PRINT_MIN="{mode_x_min},{mode_y_min}" PRINT_MAX="{mode_x_max},{mode_y_max}"
          BED_MESH_PROFILE SAVE=model_leveling
          BED_MESH_PROFILE LOAD=model_leveling
      
          # 下降Z轴到10mm, 移动到清洁位置
          G1 Z10 F600
          # MOVE_CLEAN_POSITION
      {% else %} # 需要快速调平
          BED_MESH_CALIBRATE_FAST PRINT_MIN="{mode_x_min},{mode_y_min}" PRINT_MAX="{mode_x_max},{mode_y_max}"
      {% endif %}
  {% else %} # 选择不调平
      M118 Skipping BED_MESH_CALIBRATE
      BED_MESH_PROFILE LOAD=default
      # MOVE_CLEAN_POSITION
  {% endif %}
  
  # 关闭不需要的喷嘴温度
  M118 [SDCARD_PRINT_FILE] Turn off unprinting nozzle...
  {% if left_printing_temperature > 0 %}
    M118 [SDCARD_PRINT_FILE] Left_nozzle temperature {left_printing_temperature}
  {% else %}
    M118 [SDCARD_PRINT_FILE] Turn off left_nozzle temperature.
    M104 T0 S0
  {% endif %}

  {% if right_printing_temperature > 0 %}
    M118 [SDCARD_PRINT_FILE] Right_nozzle temperature {right_printing_temperature}
  {% else %}
    M118 [SDCARD_PRINT_FILE] Turn off right_nozzle temperature.
    M104 T1 S0
  {% endif %}
  
  # 开启过滤风扇
  M106 P0 S255

  M118 [SDCARD_PRINT_FILE] Start printing the file...
  M2000 L6
  WAITTING_PAUSE F=0
  SDCARD_PRINT_FILE_BASE {rawparams}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    ##### get user parameters or use default #####
    {% set client = printer['gcode_macro _PRINT_VARIABLE']|default({}) %}
    {% set allow_park = client.park_at_cancel|default(false)|lower == 'true' %}
    {% set retract = client.cancel_retract|default(5.0)|abs %}
    {% set xoffset = printer.save_variables.variables.get('xoffset', 0) %}
    {% set yoffset = printer.save_variables.variables.get('yoffset', 0) %}
    {% set zoffset = printer.save_variables.variables.get('zoffset', 0) %}
    {% set client_value = printer['gcode_macro _LOAD_UNLOAD_VARIABLES']|default({}) %}
    {% set clean_nozzle_y = client_value.clean_nozzle_y|default(0)|float %}
    {% set z_pos = printer.toolhead.position.z %}

    {% set loadunload_client = printer['gcode_macro _LOAD_UNLOAD_VARIABLES']|default({}) %}
    {% set nozzle = loadunload_client.load_unload_nozzle|default(0) %}
    {% set clean_retract_speed = loadunload_client.clean_retract_speed|default(1000) %}
    {% set safe_retract_e = loadunload_client.safe_retract_e|default(-32.0) %}
    {% set load_speed = loadunload_client.load_speed|default(300) %}
    {% set clean_x = loadunload_client.clean_nozzle_x|default(0) %}
    {% set clean_y = loadunload_client.clean_nozzle_y|default(0) %}
    {% set clean_move_speed = loadunload_client.clean_move_speed|default(2000) %}
    {% set current_ext = printer.toolhead.extruder %}

    # 清除调平
    BED_MESH_CLEAR
    TENSION_SENSOR_POLL ENABLE=0
    G90

    # 如果是左机头就将耗材切断，如果是右机头将耗材回退到安全位置
    {% if current_ext == "extruder" or current_ext == "extruder2"%}
        M2800
    # {% elif current_ext == "extruder1" %}
    #     G92 E0
    #     G1 E{safe_retract_e} F{clean_retract_speed}
    #     M400
    {% endif %}
    
    # 下降Z到100mm位置，并移动到清理站
    {% if z_pos < 100 %}
        G1 Z100 F600
    {% endif %}

    # 移动到清理站位置
    MOVE_TO_WASTE_STATION

    #清理状态
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    # clear pause_next_layer and pause_at_layer as preparation for next print
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

    # 延时摄影渲染视频
    TIMELAPSE_RENDER

    # 停止打印
    CANCEL_PRINT_BASE
    M118 [CANCEL_PRINT] cancel_print completed

    # 设置灯光白色常亮
    G4 P2000
    M2000 S3 L0

    #恢复共挤电机步进值
    RESTORE_EXTRUDER2

    # 关闭加热，关闭风扇，释放电机
    TURN_OFF_HEATERS
    M106 S0
    M84

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    {% set force = params.F|default(0)|int %}
    {% if printer.toolhead.extruder == "extruder1" or force == 1 %}
      G90
      {% set print_mode = printer.save_variables.variables.printing_info_print_mode|default(0)|int %}
      {% if print_mode == 0 %}
          M2000 L5 S0
      {% elif print_mode == 1 %}
          M2000 L5 S1
      {% elif print_mode == 2 %}
          M2000 L5 S2
      {% endif %}
      ##### get user parameters or use default ##### 0
      {% set client = printer['gcode_macro _PRINT_VARIABLE']|default({}) %}
      {% set idle_timeout = client.idle_timeout|default(0) %}
      {% set temp_extruder = printer.extruder.target|default(0) %}
      {% set temp_extruder1 = printer.extruder1.target|default(0) %}
      {% set temp_bed = printer.heater_bed.target|default(0) %}
      {% set restore = False if printer.toolhead.extruder == ''
                  else True  if params.RESTORE|default(1)|int == 1 else False %}
      {% set client_value = printer['gcode_macro _LOAD_UNLOAD_VARIABLES']|default({}) %}
      {% set clean_nozzle_y = client_value.clean_nozzle_y|default(0)|float %}
      ##### end of definitions #####
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_temps VALUE="{{'restore': restore, 'extruder_temp': temp_extruder, 'extruder1_temp': temp_extruder1, 'bed_temp': temp_bed}}"
      # set a new idle_timeout value
      {% if idle_timeout > 0 %}
          SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
          SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
      {% endif %}
      
      PAUSE_BASE
      M400
      {% set current_z = printer.gcode_move.gcode_position.z %}
      G1 Z{current_z+4} F600
      SAVE_NOZZLE_TO_CLEAN
      MOVE_TO_WASTE_STATION
      G1 Z{current_z} F600
      #恢复共挤电机步进值
      RESTORE_EXTRUDER2
      M118 [PAUSE] pause completed
    {% else %}
      WAITTING_PAUSE F=1
    {% endif %}

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_temps: {'restore': False, 'extruder_temp': 0, 'extruder1_temp': 0, 'bed_temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  M2000 L2
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _PRINT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""     # no runout
                    else True if not printer[client.runout_sensor].enabled  # sensor is disabled
                    else printer[client.runout_sensor].filament_detected %} # sensor status
  {% set can_extrude = True if printer.toolhead.extruder == ''           # no extruder defined in config
                  else printer[printer.toolhead.extruder].can_extrude %} # status of active extruder
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####

  {% set current_z = printer.gcode_move.gcode_position.z %}
  {% set flag = printer['gcode_macro RESTORE_NOZZLE_TO_PRINT'].last_extruder_flag %}
  
  {% if last_temps.restore %}
    {% if last_temps.bed_temp > 0 %}
      M140 S{last_temps.bed_temp}
    {% endif %}
    
    {% if last_temps.extruder_temp > 0 %}
      M104 T0 S{last_temps.extruder_temp}
    {% endif %}
    
    {% if last_temps.extruder1_temp > 0 %}
      M104 T1 S{last_temps.extruder1_temp}
    {% endif %}
    M109 T0 S{last_temps.extruder_temp}
    M109 T1 S{last_temps.extruder1_temp}

  {% endif %}
  
  G1 Z{current_z+4} F600
  RESTORE_NOZZLE_TO_PRINT
  G1 Z{current_z} F600
  # 开启过滤风扇
  M106 P0 S255
  RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
  M118 [RESUME] resume completed

  # Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0|1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0|1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}
  TIMELAPSE_TAKE_FRAME

##### internal use #####
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
gcode:
  G90
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _PRINT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set use_custom     = client.use_custom_pos|default(false)|lower == 'true' %}
  {% set custom_park_x  = client.custom_park_x|default(0.0) %}
  {% set custom_park_y  = client.custom_park_y|default(0.0) %}
  {% set park_dz        = client.custom_park_dz|default(0.0)|abs %}
  {% set sp_hop         = client.speed_hop|default(15) * 60 %}
  {% set sp_move        = client.speed_move|default(velocity) * 60 %}
  ##### get config and toolhead values #####
  {% set origin    = printer.gcode_move.homing_origin %}
  {% set act       = printer.gcode_move.gcode_position %}
  {% set max       = printer.toolhead.axis_maximum %}
  {% set cone      = printer.toolhead.cone_start_z|default(max.z) %} ; height as long the toolhead can reach max and min of an delta
  {% set round_bed = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch']
                else False %}
  ##### define park position #####
  {% set z_min = params.Z_MIN|default(0)|float %}
  {% set z_park = [[(act.z + park_dz), z_min]|max, (max.z - origin.z)]|min %}
  {% set x_park = params.X       if params.X is defined
             else custom_park_x  if use_custom
             else 0.0            if round_bed
             else (max.x - 50) %}
  {% set y_park = params.Y       if params.Y is defined
             else custom_park_y  if use_custom
             else (max.y - 50)  if round_bed and z_park < cone
             else 0.0            if round_bed
             else (max.y - 50) %}
  ##### end of definitions #####
  _CLIENT_RETRACT
  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_park} F{sp_hop}
    G1 X{x_park} Y{y_park} F{sp_move}
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Printer not homed'
  {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: Retracts, if the extruder is hot enough
gcode:
  {% set client = printer['gcode_macro _PRINT_VARIABLE']|default({}) %}
  {% set length = params.LENGTH|default(client.retract)|default(1.0)|float %}
  {% set speed = params.SPEED|default(client.speed_retract)|default(35) %}

  _CLIENT_EXTRUDE LENGTH=-{length|float|abs} SPEED={speed|float|abs}

[gcode_macro SET_RIGHT_OFFSET]
description: Set the right offset for the toolhead
gcode:
  SAVE_VARIABLE VARIABLE=xoffset VALUE={params.X|default(0)}
  SAVE_VARIABLE VARIABLE=yoffset VALUE={params.Y|default(0)}
  SAVE_VARIABLE VARIABLE=zoffset VALUE={params.Z|default(0)}
  M118 [SET_RIGHT_OFFSET] Right offset set to X:{params.X|default(0)} Y:{params.Y|default(0)} Z:{params.Z|default(0)}

[gcode_macro GET_RIGHT_OFFSET]
description: Get the right offset for the toolhead
gcode:
  {% set x_offset = printer.save_variables.variables.xoffset|default(0)|float %}
  {% set y_offset = printer.save_variables.variables.yoffset|default(0)|float %}
  {% set z_offset = printer.save_variables.variables.zoffset|default(0)|float %}
  M118 [GET_RIGHT_OFFSET] Right offset is X:{x_offset} Y:{y_offset} Z:{z_offset}

[gcode_macro PRINT_COMPLETED]
description: Print complete macro
gcode:
  M118 [PRINT_COMPLETED] Print complete!
  {% set client = printer['gcode_macro _LOAD_UNLOAD_VARIABLES']|default({}) %}
  {% set safe_retract_e = client.safe_retract_e|default(-32.0) %}
  {% set clean_retract_speed = client.clean_retract_speed|default(1000) %}
  {% set current_ext = printer.toolhead.extruder %}
  {% set temperature = printer.extruder1.temperature|int %}
  
  TENSION_SENSOR_POLL ENABLE=0
  
  # # 如果是右喷嘴回退安全距离
  # {% if current_ext == "extruder1" %}
  #   {% if temperature > 180 %}
  #     M82
  #     G92 E0
  #     G1 E{safe_retract_e} F{clean_retract_speed}
  #     M400
  #   {% endif %}
  # {% endif %}

  # 移动到清理站位置
  MOVE_TO_WASTE_STATION

  #设置灯光闪烁
  G4 P2000
  M2000 L5
  # 清除打印状态
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  # 清除暂停状态
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  # 清除调平
  BED_MESH_CLEAR
  # 延时摄影渲染视频
  TIMELAPSE_RENDER
  #恢复共挤电机步进值
  RESTORE_EXTRUDER2