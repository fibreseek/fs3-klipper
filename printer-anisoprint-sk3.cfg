[include mainsail.cfg]
[include moonraker_obico_macros.cfg]
# #######################################
# 不同的主板，串口id不同
# #######################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_020024000551313239393734-if00

[mcu CB2]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 30000
max_z_velocity: 300
max_z_accel: 500 

# #######################################
# motor and extruder
# #######################################
[stepper_x]   # Motor1
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 8
rotation_distance: 40
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_endstop: 0
position_max: 400
position_min: 0
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 22
second_homing_speed: 20

[stepper_y]   # Motor2 
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 8
rotation_distance: 40
endstop_pin: tmc2240_stepper_y:virtual_endstop
#endstop_pin: PF3
position_endstop: 0
position_max: 400
position_min: 0
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 22
second_homing_speed: 20

[stepper_z]   # Motor3
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 8
rotation_distance: 2.8
endstop_pin: tmc2240_stepper_z:virtual_endstop
#position_endstop: 270
position_max: 280
position_min: -10
homing_speed: 10
#second_homing_speed: 5
homing_retract_dist: 1

[extruder]   # motor6 塑料头的近端挤出 蓝绿灰
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 5.52
max_extrude_only_distance: 1000
max_extrude_cross_section: 60
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PC7 # HE1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5 # TH1 100k
control: pid
pid_Kp: 31
pid_Ki: 15
pid_Kd: 16
min_temp: -200
max_temp: 500

[extruder2]   # motor5 共挤料挤出
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 5.7
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 1000
max_extrude_cross_section: 200.0
heater_pin: PD2 # HE0
sensor_type: PT1000
sensor_pin: PC4 # TH2 PT1000
control: pid
pid_Kp: 41
pid_Ki: 1.9
pid_Kd: 226
min_temp: -200
max_temp: 500

[extruder1]   # Motor7 纤维 黄橙紫
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 39.5
max_extrude_only_distance: 1000
max_extrude_cross_section: 5.0
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA1
sensor_type: my_custom_resistance_adc
sensor_pin: PB1 # THB
control: pid
pid_Kp: 41
pid_Ki: 1.9
pid_Kd: 226
min_temp: -200
max_temp: 300

[adc_temperature my_custom_resistance_adc]
temperature1: 200
voltage1: 0
temperature2: 220
voltage2: 2
temperature3: 230
voltage3: 3
temperature4: 250
voltage4: 4

[xyz_align]
pin: PF0
t0_offset_x:84
t0_offset_y:327
t0_offset_z:9
t0_offset_z_press:4
t1_offset_x:43
t1_offset_y:327
t1_offset_z:11
t1_offset_z_press:6
move_offset:10
speed:1500

[gcode_macro T0]
gcode:
  {% if printer.toolhead.homed_axes == 'xyz' %}    
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  G1 X0 F6000
  {% endif %}  

[gcode_macro T1]
gcode:
  {% if printer.toolhead.homed_axes == 'xyz' %}    
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  SET_GCODE_OFFSET X=41.1 Y=1.15 Z=-1.16
  G1 X305.9 F6000
  G1 X305.9 F6000
  {% endif %}
  
# #######################################
# TMC2240 configuration
# #######################################
[tmc2240 stepper_x]
cs_pin: PC13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
diag0_pin: ^!PF4
run_current: 1.6
hold_current: 0.2
stealthchop_threshold: 0
driver_SGT: 2

[tmc2240 stepper_y]
cs_pin: PE3
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
diag0_pin: ^!PF3
run_current: 1.6
hold_current: 0.2
stealthchop_threshold: 0
driver_SGT: 2

[tmc2240 stepper_z]
cs_pin: PB9
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
diag0_pin:^!PF2
run_current: 0.65
stealthchop_threshold: 0
driver_SGT: 2

[tmc2240 extruder]
cs_pin: PG10
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.7
hold_current: 0.2
stealthchop_threshold: 99999

[tmc2240 extruder2]
cs_pin: PG14
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 0.7
hold_current: 0.2
stealthchop_threshold: 99999

[tmc2240 extruder1]
cs_pin: PD5
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
run_current: 1.6
hold_current: 0.2
stealthchop_threshold: 99999

# #######################################
# sensor
# #######################################
[heater_bed]   # 热床
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0 #TH0 
max_power: 1.0
min_temp: 0
max_temp: 125
control: pid # watermark
pid_kp = 66.133
pid_ki = 1.293
pid_kd = 845.677

[servo my_servo]   # 舵机
pin: PE9
# 最大角度
maximum_servo_angle: 180
# 最小脉冲宽度，单位：微秒，转换为秒为 0.0005
minimum_pulse_width: 0.0005 
# 最大脉冲宽度，单位：微秒，转换为秒为 0.0025
maximum_pulse_width: 0.0025  
# 初始角度
initial_angle: 0

[gcode_macro M280]
gcode:
  {% set angel = params.S|default(0)|float %}
  SET_SERVO SERVO=my_servo ANGLE={angel}

#[filament_switch_sensor filament_sensor]   # 光纤传感器
#switch_pin: ^PC15

#[filament_switch_sensor filament_sensor_1]   # 断料检测传感器
#switch_pin:^PB10
#pause_on_runout: False

#[filament_motion_sensor filament_sensor_2]   # 堵料检测传感器
#switch_pin: ^PF10
#extruder:extruder
#pause_on_runout: False

[fan]   #主板风扇 M106 S255
pin: !PF9

[heater_fan fan1]   # 机头喉管风扇
pin: PB6
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp:45
fan_speed:1.0

[fan_generic fan2]   # 机头吹料风扇 SET_FAN_SPEED FAN=fan2 SPEED=1
pin: PB3

